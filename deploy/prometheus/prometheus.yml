global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pulseq-workers
    # workers expose /metrics on METRICS_PORT (default 9464). When running the
    # worker on the host (pnpm dev:worker), Prometheus reaches it via the
    # docker host gateway; in a full container deploy, list the worker services.
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: pulseq
